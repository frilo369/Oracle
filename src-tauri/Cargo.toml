[package]
name = "oracle"
version = "2.0.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-ico", "custom-protocol"] }
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-single-instance = "=2.5.5"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com"] }
winreg = "0.56"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
flate2 = "1"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
percent-encoding = "2"
semver = "1"
sha2 = "0.10"
tempfile = "3"

[profile.dev.package."*"]
debug = false

[profile.dev]
debug = 0
