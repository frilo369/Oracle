<!doctype html>
<html lang="en" data-theme="umbra">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.communitydragon.org; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; frame-src 'none'; base-uri 'self'">
  <title>Oracle</title><link rel="icon" href="oracle.png"><link rel="stylesheet" href="appearance.css"><link rel="stylesheet" href="oracle.css">
  <script src="appearance.js"></script><script type="module" src="oracle.js"></script>
</head>
<body>
  <div class="app">
    <header class="titlebar" data-tauri-drag-region>
      <div class="identity" data-tauri-drag-region><img src="oracle.png" alt=""><h1 data-tauri-drag-region>Oracle</h1><span id="version" data-tauri-drag-region></span></div>
      <div class="window-actions"><button data-action="minimize" aria-label="Minimize" title="Minimize">−</button><button data-action="hide" aria-label="Close to tray" title="Close to tray">×</button></div>
    </header>
    <nav aria-label="Main navigation"><button class="active" data-tab="overview" aria-selected="true">Overview</button><button data-tab="settings" aria-selected="false">Settings</button></nav>
    <main>
      <div id="app-error" class="error-banner" role="alert" hidden><span></span><button id="dismiss-error" aria-label="Dismiss error">×</button></div>
      <section id="overview" class="page" aria-label="Overview">
        <section class="match-card framed" aria-label="Current match">
          <div class="match-identity"><div class="portrait"><img id="match-icon" src="oracle.png" alt=""></div><div class="match-copy"><span id="connection" class="connection">Waiting for League</span><h2 id="match-champion">No active match</h2><p id="match-detail">Your champion connects automatically.</p></div><span class="live-mark" id="live-mark" hidden>LIVE</span></div>
          <button id="open-current" class="primary full" disabled>Open match guide</button>
        </section>
        <section class="shortcut-card framed" aria-label="Guide shortcut"><div><h3>Guide shortcut</h3><p id="shortcut-state">Click the key to change it.</p></div><button id="record-key" class="shortcut-key" title="Change shortcut">F1</button><button id="reset-key" class="icon-button" title="Reset to F1" aria-label="Reset shortcut to F1">↺</button></section>
        <section class="browse-card framed" aria-labelledby="browse-heading"><div class="section-heading"><h3 id="browse-heading">Browse guides</h3><span id="provider-label">MetaSRC</span></div><div class="guide-picker"><label>Champion<select id="desk-champion" aria-label="Guide champion"></select></label><label>Mode<select id="desk-mode" aria-label="Guide mode"><option value="rift">Summoner’s Rift</option><option value="aram">ARAM</option><option value="arena">Arena</option><option value="mayhem">ARAM: Mayhem</option></select></label><button id="open-guide" class="secondary">Open</button></div></section>
      </section>
      <section id="settings" class="page" aria-label="Settings" hidden>
        <section class="settings-card framed" aria-label="Startup preferences"><label class="setting-row"><div><strong>Open directly in the tray</strong><p>Show Oracle when you need it.</p></div><input id="launch-tray" type="checkbox" role="switch" checked><span class="switch" aria-hidden="true"></span></label><label class="setting-row"><div><strong>Start with Windows</strong><p>Launch quietly when you sign in.</p></div><input id="start-windows" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span></label></section>
        <section class="settings-card framed"><div class="setting-row"><div><strong>Accent colour</strong></div><input id="accent-colour" type="color" aria-label="Accent colour" value="#ae1236"><button id="reset-colour" class="text-button">Reset</button></div></section>
        <section class="settings-card framed"><label class="setting-row"><div><strong>Guide shortcut</strong><p>Enable or disable the in-game shortcut.</p></div><input id="enable-key" type="checkbox" role="switch" checked><span class="switch" aria-hidden="true"></span></label><button class="shortcut-link text-button" data-tab="overview">Change shortcut in Overview</button></section>
        <section class="settings-card framed updates-card" aria-label="Updates"><div class="setting-row"><div><strong>Oracle updates</strong><p id="update-status" role="status">Updates install automatically at startup, outside a match.</p></div><button id="check-updates" class="secondary">Check for updates</button></div></section>
      </section>
    </main>
    <footer><button class="text-button quit" data-action="quit">Quit Oracle</button><button class="tray-button" data-action="hide">Hide to tray</button></footer>
  </div><div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
